[project]
name = "elocal-mcp"
version = "1.1.0"
description = "Connect eLocal to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No eLocal API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["elocal", "elocal api", "elocal mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/mcp/elocal?utm_source=pypi&utm_medium=package&utm_campaign=elocal"
Source = "https://github.com/cotlet-connect/elocal-mcp"

[project.scripts]
elocal-mcp = "elocal_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"elocal_agent.py" = "elocal_agent.py"

[tool.hatch.build.targets.sdist]
include = ["elocal_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
